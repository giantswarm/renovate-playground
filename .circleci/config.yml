orbs:
  architect: giantswarm/architect@8.2.2

version: 2.1
workflows:
  version: 2
  build:
    jobs:
      - architect/go-build:
          context: architect
          name: go-build
          binary: renovate-playground
          filters:
            # Trigger the job also on git tag.
            tags:
              only: /^v.*/
